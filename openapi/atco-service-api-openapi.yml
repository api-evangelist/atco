  schemas:
    FeatureServiceInfo:
      type: object
      description: ArcGIS REST FeatureServer descriptor. Harvested verbatim in openapi/atco-electric-hosting-capacity-featureserver.esri.json.
      properties:
        currentVersion:
          type: number
        serviceItemId:
          type: string
        serviceDescription:
          type: string
        description:
          type: string
        capabilities:
          type: string
          description: Comma-separated capability list. This service advertises "Query" only — it is read-only.
        maxRecordCount:
          type: integer
        maxIdsCount:
          type: integer
        supportedQueryFormats:
          type: string
        supportedExportFormats:
          type: string
        spatialReference:
          $ref: '#/components/schemas/SpatialReference'
        fullExtent:
          $ref: '#/components/schemas/Extent'
        initialExtent:
          $ref: '#/components/schemas/Extent'
        layers:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              type:
                type: string
              geometryType:
                type: string
        tables:
          type: array
          items:
            type: object
    FieldInfo:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        alias:
          type: string
        sqlType:
          type: string
        length:
          type: integer
        nullable:
          type: boolean
        editable:
          type: boolean
    FeatureLayerInfo:
      type: object
      description: ArcGIS REST Feature Layer descriptor. Harvested verbatim in openapi/atco-electric-hosting-capacity-layer-0.esri.json.
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        geometryType:
          type: string
        objectIdField:
          type: string
        displayField:
          type: string
        maxRecordCount:
          type: integer
        standardMaxRecordCount:
          type: integer
        standardMaxRecordCountNoGeometry:
          type: integer
        capabilities:
          type: string
        extent:
          $ref: '#/components/schemas/Extent'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldInfo'
    Extent:
      type: object
      properties:
        xmin:
          type: number
        ymin:
          type: number
        xmax:
          type: number
        ymax:
          type: number

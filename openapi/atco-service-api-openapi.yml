          type: integer
        latestWkid:
          type: integer
  parameters:
    f:
      name: f
      in: query
      required: false
      description: Response format. The service advertises supportedQueryFormats "JSON, geoJSON, PBF"; `html` and `pjson` are also served by ArcGIS REST.
      schema:
        type: string
        enum:
        - json
        - geojson
        - pbf
        - pjson
        - html
        default: html

implementation_notes:
- >-
  A server must always send f=json. Omitting it returns the ArcGIS HTML services-directory page,
  which will break a JSON-parsing tool handler.
- >-
  Errors arrive with HTTP status 200 and an {"error": {...}} body. A handler that branches on the
  HTTP status will surface ArcGIS errors to the model as successful empty results. Parse the body.
- >-
  maxRecordCount is 1000 (32,000 with returnGeometry=false). A tool returning features must
  paginate on exceededTransferLimit or explicitly tell the model the result is truncated.
- >-
  The layer has 880,623 features. Unbounded queries will blow a model's context — default to
  returnCountOnly or aggregate (outStatistics / groupByFieldsForStatistics) and only return raw
  features when narrowly filtered.

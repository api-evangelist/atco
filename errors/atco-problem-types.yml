soft_failures:
  note: >-
    Two non-error conditions are easy to mistake for errors or for completeness.
  cases:
  - condition: exceededTransferLimit true
    meaning: >-
      The response is a partial page, not an error. More features matched than maxRecordCount
      allowed. Paginate with resultOffset / resultRecordCount.
  - condition: omitted `f` parameter
    meaning: >-
      The service returns the ArcGIS HTML services-directory page with HTTP 200, not JSON. A
      JSON parser will fail on HTML. Always send f=json or f=geojson.

findings:
  summary: >-
    ATCO is the control case for the energy sector's central question, and it
    answers it backwards. No consumer data mandate touches it: Ontario's Green
    Button regulation stops at the Ontario border, Alberta's regulators have
    written no equivalent, and the public Australian CDR energy register — 84
    brands, checked directly — does not list ATCO. It is not a Green Button
    Alliance member. So the consumer side is exactly what an unmandated market
    produces: a Salesforce commerce login where a customer can look at their own
    bill, and nothing whatsoever for a third party. And yet the open side is more
    open than any of the mandated Ontario utilities managed. ATCO Electric's DER
    hosting capacity — 880,623 feeder segments with per-feeder kW capacity — sits
    on a public Esri feature service that anyone can query anonymously, with no
    key, no signup, no licence and no rate-limit page, linked from ATCO's own
    micro-generation and grid-connection pages. Nobody made them do it. It exists
    because micro-generation applicants needed to know where the grid has room,
    and because publishing it on ArcGIS Online makes it an API by default. The
    lesson runs in the opposite direction from Hydro One: a mandate produced a
    real API that no developer can find, while an operational need produced an
    open API that nobody was obliged to publish. Neither organization has a
    developer portal, an OpenAPI, or a single line of API documentation.
  posture: unmandated · open grid data · closed consumer data · no developer program
  gated: false
  openapiHarvested: false
  esriDescriptorsHarvested: 2

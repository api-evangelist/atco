aid: atco
name: ATCO
review:
  question: >-
    Does any consumer energy data mandate reach ATCO, does it expose a consumer
    energy data API, and does it publish any genuinely open grid or market data?
  answer: >-
    No mandate reaches ATCO — Alberta has no Green Button regulation, ATCO is not
    a Green Button Alliance member, and it is absent from the public Australian
    CDR energy data holder register. There is no consumer data API. There is,
    unexpectedly, a real open grid data API: ATCO Electric's DER hosting capacity
    feature service, anonymously queryable with no signup. No OpenAPI or Swagger
    definition exists anywhere on the estate.
  date: '2026-07-27'
  reviewer: API Evangelist
  homeMarket: Canada
  tier: utility-retailer

mandate:
  regime: none
  status: not-applicable
  instrument: none
  appliesToThisOrganization: false
  whyNoMandateApplies:
    - >-
      Ontario Regulation 633/21 (Energy Data), the only Green Button mandate in
      Canada, binds Ontario local distribution companies. ATCO's regulated wires
      and pipes businesses are in Alberta (ATCO Electric, ATCO Gas, ATCO
      Pipelines). ATCO does not distribute electricity or natural gas in Ontario,
      so O. Reg. 633/21 does not reach it. Alberta's own regulators — the Alberta
      Utilities Commission and the AESO — have imposed no equivalent consumer
      energy data right.
    - >-
      Australia's Consumer Data Right energy sector was checked directly rather
      than assumed. GET https://api.cdr.gov.au/cdr-register/v1/energy/data-holders/brands/summary
      (HTTP 200, header x-v: 1, fetched 2026-07-27) returned 84 energy data
      holder brands. No brand name contains "ATCO". ATCO Australia operates gas
      distribution infrastructure in Western Australia; the CDR energy
      designation covers energy retailers operating through the National
      Electricity Market, which does not include Western Australia and does not
      include gas distributors. ATCO is therefore not a designated CDR data
      holder and is not on the register.
    - >-
      Green Button voluntary adoption was checked and not found.
      https://www.greenbuttonalliance.org/members returned HTTP 200 and contains
      no occurrence of "atco". https://www.greenbuttonalliance.org/certified
      returned HTTP 404. The string "green button" does not appear on
      https://www.atco.com/en-ca/for-home.html, https://electric.atco.com/en-ca.html,
      https://gas.atco.com/en-ca.html, or
      https://www.atco.com/en-ca/for-home/natural-gas/our-services/gas-meters.html
      (all HTTP 200, grepped case-insensitively, zero hits each).
  claimVersusImplementationNote: >-
    There is no compliance claim to discount here. ATCO makes no Green Button
    claim, no CDR claim, and no consumer data API claim anywhere on its web
    estate. Recorded as regime "none" / status "not-applicable" on negative
    evidence from three independent registers plus the company's own sites, not
    on absence of search results.

dataStandard:
  name: no energy data standard reference found
  detail: >-
    No Green Button / NAESB ESPI, no CDR Consumer Data Standards, no OCPP, no
    OCPI, no OpenADR, no IEEE 2030.5, and no IEC CIM 61968/61970 reference was
    found on atco.com, electric.atco.com, gas.atco.com, or atcoenergy.com. ATCO
    runs EV charging projects (Peaks to Prairies, Alberta EV Corridor, Edmonton
    curbside EV charging, all listed in the en-ca sitemap) but publishes no OCPP
    or OCPI surface for them.
  onlyMachineReadableContract: >-
    Esri ArcGIS REST Feature Service (currentVersion 12). This is a geospatial
    API convention, not an energy data standard, but it is self-describing and
    it is the only machine-readable contract ATCO publishes. Both descriptors
    were harvested verbatim into openapi/.

consumerVersusMarketData:
  consumer_data_api: false
  consumerDataNote: >-
    No third party can obtain an individual ATCO customer's usage or billing data
    through any documented API. ATCO Energy, the competitive Alberta retailer,
    routes "My Account" at https://myaccount.atcoenergy.com through an HTTP 301
    to https://store.atco.com/ccrz__CCSiteLogin — a Salesforce CloudCraze (ccrz)
    commerce login. That is a customer login for a customer's own data, not an
    API. https://www.atcoenergy.com/api returned HTTP 301 to "/" — a redirect to
    the homepage, not an API root. https://www.atcoenergy.com/developers returned
    HTTP 404. There is no consent framework, no third-party onboarding, and no
    published usage data export of any kind.
  market_data_open: true
  marketDataNote: >-
    This is the finding for ATCO and it is the inverse of the Ontario utilities.
    ATCO Electric publishes DER hosting capacity for its Alberta distribution
    system as a public, anonymously queryable Esri ArcGIS REST feature service at
    https://services7.arcgis.com/cw2emabghNLkoYlB/arcgis/rest/services/AGO_HostingCapacity/FeatureServer
    (HTTP 200). No key, no signup, no referer check, no licence click-through.
    GET .../FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json returned
    {"count":880623} anonymously on 2026-07-27. Ownership is confirmed, not
    inferred: the ArcGIS item 7b4d2b3dcecb4a509f34cbfc3587ff3e is titled "ATCO
    Electric Hosting Capacity", description "CYME Hosting Capacity Map", access
    "public", owner "timothy.oladunni_AET", and the containing web application
    fa9c52c758b64f90ada01c9d27609d8d declares portalUrl
    https://atco.maps.arcgis.com, whose /sharing/rest/portals/self returns urlKey
    "ATCO". ATCO Electric links the application itself from its own pages —
    .../new-connections-changes/connect-grid.model.json contains
    https://atco.maps.arcgis.com/apps/webappviewer/index.html?id=fa9c52c758b64f90ada01c9d27609d8d
    and .../new-connections-changes/micro-generation.model.json contains the
    arcgis.com form of the same application. Beyond this one dataset, ATCO
    publishes no open data portal, no system or market feed, and no documented
    outage API; Alberta wholesale market and system data is published by the
    AESO, a separate organization.
  theSplit: >-
    Open grid data, closed consumer data — the exact opposite of Hydro One, where
    a mandate produced a real but undiscoverable consumer data API and zero open
    grid data. ATCO has no mandate at all and yet published the more open API of
    the two. Nothing compelled the hosting capacity service; it exists because
    micro-generation applicants needed it, and the openness is a side effect of
    shipping it on ArcGIS Online rather than a data-sharing policy.

accessGate:
  gate: self-serve
  whatADeveloperMustDo:
    - >-
      For the open grid data: nothing. Issue an anonymous HTTPS GET against
      https://services7.arcgis.com/cw2emabghNLkoYlB/arcgis/rest/services/AGO_HostingCapacity/FeatureServer/0/query
      with standard ArcGIS REST query parameters. No account, no key, no token,
      no application form, no licence agreement. Capabilities are "Query" only
      and maxRecordCount is 1000, so paginate with resultOffset/resultRecordCount.
    - >-
      For consumer usage or billing data: there is no path. A retail customer can
      log in to My Account at https://store.atco.com/ccrz__CCSiteLogin to see
      their own bills. A third party has no mechanism at all — no OAuth, no
      consent flow, no vendor onboarding form, no contact address published for
      data access.
  selfServe: true
  gatedOverall: false
  gateSplitNote: >-
    The single access_gate value is self-serve because the only real API ATCO
    publishes is completely ungated. The consumer side is honestly
    customer-account-required and there is no developer route through it.

authModel:
  scheme: none — anonymous, unauthenticated HTTPS
  detail: >-
    The hosting capacity feature service accepts anonymous requests. No token
    parameter is required and no 499/498 ArcGIS token error is returned. No API
    key, OAuth 2.0, OpenID Connect, mTLS, or accreditation applies.
  openidConnectDiscovery: >-
    Not served. https://www.atco.com/.well-known/openid-configuration returned
    HTTP 404 and https://www.atcoenergy.com/.well-known/openid-configuration
    returned HTTP 404. https://poweroutage.atco.com/.well-known/openid-configuration
    returned HTTP 200 but the body is the Flutter single-page-app index.html, not
    a discovery document.
  consumerAuth: >-
    Salesforce CloudCraze (ccrz) customer login at
    https://store.atco.com/ccrz__CCSiteLogin. Human login only; no documented
    machine grant.

downloadableContracts:
  openapiFound: false
  swaggerFound: false
  specsHarvested: 0
  esriDescriptorsHarvested: 2
  openapiDirectory: openapi/
  enrichmentRound2026_07_27: >-
    Re-checked and still true: ATCO publishes no OpenAPI. Contract discovery was re-run against
    the API host root as well as the docs hosts — https://services7.arcgis.com/openapi.json
    returns 403 (Esri edge), and /openapi.json, /swagger.json and /api-docs return 404 on every
    ATCO host. No GraphQL and no MCP endpoint exists to introspect. The ArcGIS tenant service
    listing (GET /cw2emabghNLkoYlB/arcgis/rest/services?f=json, HTTP 200) confirms exactly one
    public FeatureServer — AGO_HostingCapacity — so there is no second undiscovered API. What
    changed is that the enrichment round GENERATED an OpenAPI 3.1 from the two verbatim Esri
    descriptors plus live anonymous probes, saved at
    openapi/atco-electric-hosting-capacity-openapi.yml. It is an API Evangelist artifact, not an
    ATCO one, and it is labelled as such in its own info block and in apis.yml.
  note: >-
    No OpenAPI or Swagger document exists anywhere on the ATCO estate. What was
    harvested into openapi/ are two Esri ArcGIS REST service descriptors — real,
    machine-readable, self-describing API contracts, but NOT OpenAPI. They are
    filed under openapi/ with an ".esri.json" suffix so they are never mistaken
    for OpenAPI documents. Both parse as JSON.
  artifacts:
    - path: openapi/atco-electric-hosting-capacity-featureserver.esri.json
      sourceURL: https://services7.arcgis.com/cw2emabghNLkoYlB/arcgis/rest/services/AGO_HostingCapacity/FeatureServer?f=json
      httpStatus: 200
      fetched: '2026-07-27'
      format: Esri ArcGIS REST FeatureServer descriptor (JSON)
      note: >-
        serviceDescription "AGO Hosting Capacity", currentVersion 12,
        capabilities "Query", maxRecordCount 1000, one layer — id 0,
        "Hosting Capacity (KW)".
    - path: openapi/atco-electric-hosting-capacity-layer-0.esri.json
      sourceURL: https://services7.arcgis.com/cw2emabghNLkoYlB/arcgis/rest/services/AGO_HostingCapacity/FeatureServer/0?f=json
      httpStatus: 200
      fetched: '2026-07-27'
      format: Esri ArcGIS REST Feature Layer descriptor (JSON)
      note: >-
        geometryType esriGeometryPolyline. Fields OBJECTID, FEEDER, PHASE,
        SUB_NAME, SUB_NUM, DATELOADED, DER_CAP_KW, DER_CAP_KW1, PROJECT_AREA,
        SE_ANNO_CAD_DATA, Shape__Length.


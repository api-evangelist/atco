apis:
- aid: atco:atco-electric-hosting-capacity-feature-service
  name: ATCO Electric Hosting Capacity Feature Service
  description: >-
    ATCO Electric's distributed energy resource (DER) hosting capacity data,
    published as a public Esri ArcGIS REST feature service and surfaced through
    the "DER HOSTING CAPACITY MAP" web application that ATCO Electric links from
    its micro-generation and connect-to-the-grid pages. The service is registered
    in ATCO's own ArcGIS Online organization (urlKey "ATCO", item id
    7b4d2b3dcecb4a509f34cbfc3587ff3e, item title "ATCO Electric Hosting Capacity",
    description "CYME Hosting Capacity Map", access "public"). A single polyline
    feature layer, "Hosting Capacity (KW)", exposes FEEDER, PHASE, SUB_NAME,
    SUB_NUM, DATELOADED, DER_CAP_KW, DER_CAP_KW1 and PROJECT_AREA fields. An
    anonymous, unauthenticated query against layer 0 returned a feature count of
    880,623 on 2026-07-27. Service capabilities are "Query" only, maxRecordCount
    1000. There is no ATCO documentation page, no OpenAPI definition, and no
    published usage terms — the contract is the self-describing ArcGIS REST
    service descriptor itself, harvested verbatim into openapi/.

name: ATCO
kind: company
description: >-
  ATCO Ltd. (TSX: ACO.X) is a Calgary, Alberta diversified global corporation and
  the controlling shareholder of Canadian Utilities Limited, through which it runs
  the regulated energy businesses that make it one of western Canada's largest
  utility groups. It sits across several tiers of the value chain at once: ATCO
  Electric owns and operates electricity transmission and distribution across
  Alberta, ATCO Gas and ATCO Pipelines distribute and transmit natural gas in the
  province, ATCO EnPower builds storage, renewables and hydrogen assets, ATCO
  Australia operates gas distribution infrastructure in Western Australia, and
  ATCO Energy is a competitive retailer selling electricity, natural gas and home
  services to Alberta customers. Its API posture is the mirror image of the
  Ontario utilities: no consumer energy data mandate reaches it at all. Alberta
  has no Green Button regulation, ATCO is not on the Green Button Alliance member
  list, and it does not appear in the public Australian CDR energy data holder
  register — so there is no consumer data API, and a customer's usage and billing
  data lives only behind the My Account login on a Salesforce commerce portal.
  What ATCO does publish, unmandated and without any signup at all, is real open
  grid data: ATCO Electric's DER hosting capacity map is served from a public,
  anonymously queryable Esri ArcGIS REST feature service carrying 880,623 feeder
  segment features, linked directly from ATCO Electric's own micro-generation and
  grid-connection pages. Open grid data, closed consumer data, no developer
  portal, and no OpenAPI anywhere on the estate.
